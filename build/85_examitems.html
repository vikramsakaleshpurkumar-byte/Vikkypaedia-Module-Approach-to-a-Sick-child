<script>
/* ============================================================================
   Fresh integrative items for the final assessment only.
   These do NOT appear as unit checkpoints. Each crosses two or more units.
   ========================================================================= */
window.EXAM_ITEMS = (function(){
function I(id, unit, stem, opts, rationale){
  return { id:id, unit:unit, source:"fresh", stem:stem,
           opts: opts.map(function(o){ return { html:o[0], correct:!!o[1] }; }),
           rationale: rationale };
}
return [

I("X01", 8,
 "At a district hospital without a ventilator, a 2-year-old with 3 days of fever has heart rate 165/min, capillary refill 4 s, BP 88/54 mmHg, glucose 2.1 mmol/L and haemoglobin 4.5 g/dL. Which set of actions is most appropriate in the first 30 minutes?",
 [["60 mL/kg of 0.9% saline over the first hour, then antibiotics once cultures are back.", 0],
  ["10% glucose 5 mL/kg, IV antibiotics now, maintenance fluid without a bolus, urgent blood transfusion, and early transfer.", 1],
  ["20 mL/kg of 5% dextrose to treat both the hypoglycaemia and the shock.", 0],
  ["Oral ORS and paracetamol, and review in two hours.", 0]],
 "<h6>Why</h6><p>His pressure (88) is above the hypotension threshold for age (74), so without intensive care the 2026 guideline strongly recommends <b>no bolus</b>. The things that change his outcome here are correcting the <b>glucose</b>, <b>antibiotics now</b>, and treating <b>severe anaemia with blood</b> &mdash; the FEAST population.</p><div class='why-wrong'>Large saline boluses increased mortality in exactly this group; antibiotics must never wait for cultures. 5% dextrose is not a resuscitation fluid. ORS and review ignore hypoglycaemia, sepsis and severe anaemia.</div>"),

I("X02", 5,
 "A 6-week-old presents with poor feeding and fast breathing. Heart rate 230/min without variation, capillary refill 4 s, liver 4 cm. ECG shows a narrow-complex regular tachycardia. What is the first treatment?",
 [["20 mL/kg saline bolus for septic shock.", 0],
  ["Vagal manoeuvre (ice-cold water to the face), then adenosine 0.1 mg/kg by rapid push with flush if it fails.", 1],
  ["IV digoxin loading.", 0],
  ["Immediate prostaglandin E1 infusion.", 0]],
 "<h6>Why</h6><p>A fixed rate of 230 with a narrow complex in an infant is <b>SVT</b>, and the big liver shows it is causing heart failure. Treat the rhythm: vagal manoeuvre, then adenosine; synchronised cardioversion if unstable.</p><div class='why-wrong'>A bolus worsens failure. Digoxin is slow and not first-line for acute SVT. Prostaglandin is for duct-dependent lesions, which do not produce a fixed rate of 230.</div>"),

I("X03", 16,
 "A 20-month-old with bilateral pitting oedema of the feet and legs is lethargic, with cold hands, capillary refill 4 s and a weak fast pulse. What is the correct fluid?",
 [["Ringer's lactate 30 mL/kg over 30 minutes (Plan C).", 0],
  ["Ringer's lactate with 5% glucose, 15 mL/kg over one hour, checking pulse and breathing every 5&ndash;10 minutes.", 1],
  ["No fluid at all, because oedematous children are overloaded.", 0],
  ["20 mL/kg of 0.9% saline over 10 minutes, repeated to 60 mL/kg.", 0]],
 "<h6>Why</h6><p>Bilateral pitting oedema means severe malnutrition. With signs of shock, WHO gives <b>15 mL/kg over one hour</b> of a glucose-containing fluid, with close monitoring, then switches to ReSoMal if improving or treats as septic shock if not.</p><div class='why-wrong'>Plan C and repeated saline boluses can cause heart failure. Withholding all fluid ignores shock.</div>"),

I("X04", 7,
 "A 10-year-old with type 1 diabetes has vomiting and deep sighing breathing. Glucose 26 mmol/L, pH 7.08, sodium 131 mmol/L, chloride 98, bicarbonate 6. What is the anion gap, and what is the main cause of the acidosis?",
 [["27 mmol/L; ketoacidosis.", 1],
  ["27 mmol/L; lactic acidosis from shock.", 0],
  ["12 mmol/L; hyperchloraemic acidosis.", 0],
  ["17 mmol/L; renal tubular acidosis.", 0]],
 "<h6>Why</h6><p>Gap = Na &minus; (Cl + HCO₃) = 131 &minus; (98 + 6) = <b>27</b>, a raised-gap acidosis. With glucose 26 and known diabetes it is <b>ketoacidosis</b>.</p><div class='why-wrong'>Lactate can contribute but is not the main cause here. A normal gap would be hyperchloraemic; RTA does not produce a raised gap.</div>"),

I("X05", 12,
 "A 3-year-old is brought 40 minutes after swallowing about 20 of his grandmother's iron tablets. He has vomited twice. Which statement is correct?",
 [["Give activated charcoal, which binds iron well.", 0],
  ["Estimate the elemental iron dose per kg, X-ray the abdomen for tablets, and discuss desferrioxamine and whole-bowel irrigation with a poison centre.", 1],
  ["Reassure: vomiting means the tablets have come out.", 0],
  ["Induce further vomiting with salt water.", 0]],
 "<h6>Why</h6><p>Iron is dangerous above about 60 mg/kg of elemental iron, has a deceptive &ldquo;quiet&rdquo; phase, and is not bound by charcoal. <b>Calculate, image, and plan</b> desferrioxamine or whole-bowel irrigation with expert advice.</p><div class='why-wrong'>Charcoal does not bind iron. Early vomiting is a sign of toxicity, not of safety. Induced vomiting is not used, and salt water can cause dangerous hypernatraemia.</div>"),

I("X06", 13,
 "A 9-month-old is convulsing at a PHC with no IV access. The seizure started 6 minutes ago. What is the best first drug?",
 [["IM phenytoin 20 mg/kg.", 0],
  ["Buccal or intranasal midazolam 0.3 mg/kg.", 1],
  ["Oral paracetamol for fever.", 0],
  ["Wait for IV access before giving anything.", 0]],
 "<h6>Why</h6><p>At 5 minutes a benzodiazepine is due by <b>whatever route is available</b>. Buccal or intranasal midazolam needs no cannula and works quickly.</p><div class='why-wrong'>Phenytoin is not given IM and is second-line. Paracetamol does not stop seizures. Waiting for IV access lets the seizure become harder to stop.</div>"),

I("X07", 14,
 "A 12-year-old bitten on the foot by a Russell's viper 3 hours ago has a swollen leg and bleeding gums. The 20-minute whole blood clotting test shows unclotted blood. He weighs 32 kg. What is the correct initial antivenom?",
 [["3 vials, scaled to his weight.", 0],
  ["10 vials of polyvalent ASV over 30 minutes, with adrenaline drawn up, repeating the 20WBCT at 6 hours.", 1],
  ["No ASV until the bleeding stops.", 0],
  ["Fresh frozen plasma alone.", 0]],
 "<h6>Why</h6><p>Incoagulable blood with bleeding is systemic haemotoxic envenomation. Children receive the <b>same number of vials as adults</b>; the national protocol starts with 10 vials over 30 minutes and repeats by the 20WBCT.</p><div class='why-wrong'>Weight-scaling under-treats. Bleeding is a reason to give ASV, not to withhold it. Plasma without antivenom is consumed by ongoing venom activity.</div>"),

I("X08", 4,
 "A 5-year-old with severe asthma has been on nebulised salbutamol for an hour. She is now quieter, her wheeze is softer, her respiratory rate has fallen from 48 to 22, and she is drowsy. SpO₂ is 88% on a non-rebreathing mask. What is happening?",
 [["She is improving; reduce the nebulisers.", 0],
  ["Life-threatening asthma with exhaustion: call senior help, get a blood gas, give IV magnesium and prepare for ventilation.", 1],
  ["Salbutamol toxicity; stop all bronchodilators.", 0],
  ["She is falling asleep after a tiring night; let her rest.", 0]],
 "<h6>Why</h6><p>A falling rate, a <b>quieter chest</b>, drowsiness and hypoxaemia on high oxygen is <b>exhaustion</b>, not recovery &mdash; the tiring child of Units 3 and 4. Escalate now.</p><div class='why-wrong'>A silent chest means little air movement. Salbutamol toxicity causes tachycardia and tremor, not drowsiness with hypoxaemia. Letting her &ldquo;rest&rdquo; misses pre-arrest.</div>"),

I("X09", 17,
 "A 4-week-old is brought with poor feeding. Temperature 38.4 &deg;C; he is moving normally. Referral is possible and the family agrees. What should happen?",
 [["Oral amoxicillin at home, as he is over 7 days old.", 0],
  ["Give the first antibiotic doses, keep him warm with the mother, and refer for hospital care.", 1],
  ["Paracetamol and review in 48 hours.", 0],
  ["Refer without any treatment, to avoid masking the diagnosis.", 0]],
 "<h6>Why</h6><p>Poor feeding and a temperature of 38 &deg;C or above are two WHO signs of possible serious bacterial infection. Where referral is possible, <b>give pre-referral antibiotics and refer</b>.</p><div class='why-wrong'>Home amoxicillin alone is for fast breathing only in infants aged 7&ndash;59 days. Paracetamol and waiting risk deterioration. Withholding the first dose delays treatment of a possibly septic infant.</div>"),

I("X10", 10,
 "A 9-year-old in septic shock has had 60 mL/kg of fluid and is on adrenaline 0.3 microgram/kg/min and noradrenaline 0.3 microgram/kg/min, still hypotensive. What does the 2026 guideline suggest?",
 [["A further 40 mL/kg fluid bolus.", 0],
  ["Either add vasopressin or further titrate the catecholamines, with intensive-care and senior input.", 1],
  ["Stop both drugs and switch to dopamine.", 0],
  ["Routine high-dose methylprednisolone.", 0]],
 "<h6>Why</h6><p>For children needing high-dose vasoactives, the 2026 guideline suggests <b>adding vasopressin or further titrating catecholamines</b> (conditional, low certainty). Look again for untreated causes: source, tamponade, pneumothorax, low calcium, adrenal insufficiency.</p><div class='why-wrong'>More fluid after 60 mL/kg without evidence of responsiveness adds harm. Dopamine is less effective than the drugs already running. Methylprednisolone is not recommended.</div>"),

I("X11", 11,
 "An 8-year-old in DKA is 5 hours into treatment. Glucose has fallen from 32 to 13 mmol/L; pH is 7.15 and ketones remain high. What is the correct change?",
 [["Stop the insulin, because the glucose is nearly normal.", 0],
  ["Add glucose to the IV fluid and continue the insulin infusion.", 1],
  ["Give a bolus of insulin to clear the ketones faster.", 0],
  ["Give sodium bicarbonate for the pH.", 0]],
 "<h6>Why</h6><p>Insulin is needed to clear ketones, which lag behind the glucose. When glucose falls below about 14&ndash;17 mmol/L, <b>add glucose and keep the insulin running</b>.</p><div class='why-wrong'>Stopping insulin lets the ketoacidosis continue. Insulin boluses are never used. Bicarbonate is associated with cerebral injury.</div>"),

I("X12", 15,
 "A 4-year-old fell from a first-floor balcony. He is crying, GCS 15, with a tender swollen left thigh. Heart rate 160/min, capillary refill 4 s, BP 90/56 mmHg. What is the most likely cause of his tachycardia, and the first priority?",
 [["Pain alone; give analgesia and reassess before anything else.", 0],
  ["Haemorrhage (femur, chest, abdomen or pelvis): two IV/IO lines, blood sent, blood products early, and a search for the source.", 1],
  ["Anxiety; ask the parents to calm him.", 0],
  ["Head injury; urgent CT before other steps.", 0]],
 "<h6>Why</h6><p>Tachycardia with poor perfusion after a significant fall is <b>haemorrhage until proven otherwise</b>. A femoral fracture alone can lose a large share of a child's blood volume. Give analgesia too &mdash; but after, not instead of, treating shock.</p><div class='why-wrong'>Pain does not cause a 4-second capillary refill. Anxiety is a diagnosis of exclusion. With GCS 15, CT is not the first priority over haemorrhage control.</div>"),

I("X13", 19,
 "A 7-year-old with congenital adrenal hyperplasia on hydrocortisone has vomited all day and is drowsy. BP 70/40 mmHg, glucose 2.4 mmol/L, sodium 124 mmol/L. What is the most urgent drug?",
 [["IV hydrocortisone 100 mg immediately, with glucose and saline.", 1],
  ["Ondansetron and oral rehydration.", 0],
  ["Fludrocortisone tablets.", 0],
  ["Wait for a cortisol level before giving steroids.", 0]],
 "<h6>Why</h6><p>This is an <b>adrenal crisis</b>. Give <b>IV or IM hydrocortisone immediately</b> (about 100 mg over 5 years of age), with glucose for the hypoglycaemia and saline for the shock. Never wait for tests.</p><div class='why-wrong'>Oral treatment fails when the child is vomiting and shocked. Fludrocortisone is maintenance, not rescue. Waiting for cortisol delays life-saving treatment.</div>"),

I("X14", 6,
 "A 7-year-old from Gorakhpur district in August has fever for 4 days, then seizures and altered sensorium. What must be done in addition to emergency treatment?",
 [["Nothing more; this is febrile delirium.", 0],
  ["Notify as Acute Encephalitis Syndrome, and look for scrub typhus, JE, dengue and malaria.", 1],
  ["Discharge once the seizures stop.", 0],
  ["Give only antiviral therapy and wait.", 0]],
 "<h6>Why</h6><p>Fever with altered sensorium or seizures meets the <b>Acute Encephalitis Syndrome</b> definition, which is notifiable. In this region and season, <b>scrub typhus</b> (treatable with doxycycline or azithromycin) and Japanese encephalitis are both important.</p><div class='why-wrong'>&ldquo;Febrile delirium&rdquo; misses encephalitis. Discharge after seizures stop ignores the cause. Antiviral therapy alone misses treatable bacterial and rickettsial causes.</div>"),

I("X15", 20,
 "A 14-year-old girl is brought with abdominal pain and is found to be pregnant. She is not married. What is the doctor's legal duty in India?",
 [["Keep it confidential at her request; no report is needed.", 0],
  ["Report to the Special Juvenile Police Unit or local police under POCSO, while providing care and support.", 1],
  ["Report only if the parents agree.", 0],
  ["Refer her to another hospital and take no further action.", 0]],
 "<h6>Why</h6><p>Pregnancy in a child under 18 indicates a sexual offence under the <b>POCSO Act, 2012</b>, which makes reporting <b>mandatory</b>; failure to report is an offence. Care, confidentiality within the law, and support continue alongside the report.</p><div class='why-wrong'>Confidentiality and parental consent do not override the statutory duty. Referring on without reporting does not discharge it.</div>"),

I("X16", 9,
 "A 3-year-old with fever and a spreading purpuric rash is in shock. The CHC has ceftriaxone but no blood culture bottles. What should you do?",
 [["Wait until you reach the district hospital so a culture can be taken first.", 0],
  ["Give IV or IO ceftriaxone now, then transfer.", 1],
  ["Give oral amoxicillin and transfer.", 0],
  ["Give IV fluids only; antibiotics can start after admission.", 0]],
 "<h6>Why</h6><p>Suspected meningococcal septic shock: <b>antibiotics within the hour</b>. A culture is taken first only when it causes no delay. Without culture bottles, give the antibiotic now.</p><div class='why-wrong'>Delaying antibiotics for a culture, or giving them orally, is dangerous in septic shock. Fluid alone treats none of the cause.</div>"),

I("X17", 3,
 "An infant is intubated for severe pneumonia and ventilated. Five minutes later SpO₂ falls to 70%, the heart rate falls to 80/min, and there is no end-tidal CO₂ trace. What is the first thing to check?",
 [["Whether a pneumothorax needs draining.", 0],
  ["Whether the tube has become displaced (DOPES: Displacement first).", 1],
  ["Whether the oxygen saturation probe has fallen off.", 0],
  ["Whether the infant needs more sedation.", 0]],
 "<h6>Why</h6><p>Loss of the CO₂ trace with desaturation and bradycardia is <b>tube displacement or obstruction</b> until proven otherwise. Work through DOPES in order; ventilate by bag and, if in doubt, take the tube out and bag-mask ventilate.</p><div class='why-wrong'>A pneumothorax would still show some CO₂. A loose probe would not change the heart rate or the capnograph. Sedation does not fix a displaced tube.</div>"),

I("X18", 12,
 "A 15-year-old is brought after drinking an unknown liquid from the farm shed. She has a garlicky odour on her breath, is hypotensive and has frequent ectopic beats. What is the most likely poison and the correct approach?",
 [["Organophosphate; high-dose atropine is the antidote.", 0],
  ["Aluminium phosphide; there is no antidote &mdash; aggressive supportive care and early referral to intensive care.", 1],
  ["Kerosene; observe for 6 hours.", 0],
  ["Paracetamol; start N-acetylcysteine.", 0]],
 "<h6>Why</h6><p>Garlic odour, refractory shock and arrhythmia after a farm-shed ingestion suggest <b>aluminium phosphide</b>. There is no antidote; mortality is high. Supportive care, and early transfer to intensive care. And a confidential psychosocial assessment: most adolescent pesticide ingestions are deliberate.</p><div class='why-wrong'>Organophosphates cause a wet, cholinergic picture with bradycardia. Kerosene does not cause refractory shock. Paracetamol does not cause early hypotension and arrhythmia.</div>"),

I("X19", 2,
 "A mother brings a 2-year-old to a busy OPD. The child is alert and playful, breathing comfortably, but has visible severe wasting. No emergency signs. What is the ETAT category?",
 [["Emergency.", 0],
  ["Priority.", 1],
  ["Non-urgent.", 0],
  ["Emergency, if MUAC is below 125 mm.", 0]],
 "<h6>Why</h6><p>Visible severe wasting is an ETAT <b>priority</b> sign (the M of 3 TPR MOB): front of the queue for prompt assessment, not immediate resuscitation.</p><div class='why-wrong'>No emergency sign is present. It is not non-urgent: malnourished children deteriorate quickly and hide infection. MUAC below 125 mm defines moderate wasting and is not an ETAT emergency criterion.</div>"),

I("X20", 8,
 "A 6-year-old with dengue on day 5 has abdominal pain, a rising haematocrit and platelets of 22,000/µL. Capillary refill 3 s, BP 96/70 mmHg (pulse pressure 26). Which statement is correct?",
 [["He is in the recovery phase; stop IV fluids.", 0],
  ["He is in the critical phase with plasma leak; give titrated crystalloid guided by haematocrit and perfusion per the national dengue guideline, avoiding over-infusion.", 1],
  ["Give 60 mL/kg of saline over an hour as for septic shock.", 0],
  ["Transfuse platelets immediately because of the count.", 0]],
 "<h6>Why</h6><p>Warning signs on day 5 with rising haematocrit indicate the <b>critical phase</b>. Fluid is titrated to haematocrit and clinical response, not given as repeated large boluses, and reduced as the leak stops.</p><div class='why-wrong'>This is not the recovery phase. Septic-shock bolus volumes cause pulmonary oedema when the leak reverses. Prophylactic platelet transfusion without significant bleeding is not recommended.</div>"),

I("X21", 13,
 "A 2-year-old with a first febrile convulsion has been seizing for 25 minutes despite two doses of benzodiazepine. The only second-line drug available is phenobarbital. What should you do?",
 [["Give phenobarbital 20 mg/kg IV, monitoring breathing and blood pressure.", 1],
  ["Give a third benzodiazepine dose instead.", 0],
  ["Wait for levetiracetam to be obtained from the city.", 0],
  ["Cool the child and observe.", 0]],
 "<h6>Why</h6><p>Any seizure over 5 minutes is status epilepticus, fever or not. With two benzodiazepine doses given, move to a second-line drug; <b>phenobarbital 20 mg/kg</b> is appropriate where others are unavailable. Be ready to support breathing.</p><div class='why-wrong'>A third benzodiazepine adds respiratory depression. Waiting lets the seizure become refractory. Cooling does not stop status.</div>"),

I("X22", 16,
 "A severely wasted 18-month-old is admitted. Which set of actions belongs in the first day?",
 [["Iron and folic acid, high-energy F-100 feeds, and a transfusion for Hb 7 g/dL.", 0],
  ["Warmth, feeds of F-75 every 2&ndash;3 hours including at night, glucose checks, antibiotics, and no iron.", 1],
  ["IV fluids at maintenance and nil by mouth for 24 hours.", 0],
  ["Standard ORS and a normal family diet.", 0]],
 "<h6>Why</h6><p>Stabilisation means the first steps of the WHO ten: <b>prevent hypoglycaemia and hypothermia, start F-75, give antibiotics, and withhold iron</b>.</p><div class='why-wrong'>Iron and F-100 belong to rehabilitation; transfusion at 7 g/dL is not indicated. Fasting worsens hypoglycaemia. Standard ORS has too much sodium; a normal diet risks refeeding syndrome.</div>"),

I("X23", 1,
 "A district hospital reviews ten child deaths. Seven died within 12 hours of arrival; in five, the triage record showed an emergency sign, but the first doctor's review happened after 2 hours. Which improvement is most likely to reduce deaths?",
 [["Buy a CT scanner.", 0],
  ["Make any ETAT emergency sign trigger immediate treatment at the triage point, and audit time from arrival to first treatment.", 1],
  ["Run an annual lecture on sepsis.", 0],
  ["Add a new diagnostic laboratory test for sepsis.", 0]],
 "<h6>Why</h6><p>The signs were recognised but not acted on: a <b>process</b> failure between triage and treatment. Tie emergency signs to immediate action and measure the time.</p><div class='why-wrong'>Imaging and new tests do not fix a two-hour gap. Annual lectures rarely change behaviour on their own.</div>"),

I("X24", 10,
 "A 5-year-old has anaphylaxis after a wasp sting. She received IM adrenaline 0.15 mg five minutes ago and is still hypotensive with stridor. What next?",
 [["Repeat IM adrenaline, give a 10&ndash;20 mL/kg crystalloid bolus, and call for help; consider an adrenaline infusion if she remains unresponsive.", 1],
  ["Give IV chlorpheniramine and wait for it to work.", 0],
  ["Give IV hydrocortisone as the main treatment.", 0],
  ["Wait 30 minutes before any further adrenaline.", 0]],
 "<h6>Why</h6><p>IM adrenaline can be <b>repeated after 5 minutes</b>. Add fluid for hypotension and prepare for an infusion if two doses fail.</p><div class='why-wrong'>Antihistamines and steroids are adjuncts and do not treat shock or airway swelling. A 30-minute wait is dangerous.</div>"),

I("X25", 18,
 "A 4-year-old has been brought to the OPD three times in two weeks with fever. Each time she was given a different antibiotic. Her mother says, &ldquo;She is not playing any more.&rdquo; Which step is most appropriate now?",
 [["A fourth antibiotic, with a stronger spectrum.", 0],
  ["Stop and reassess: full examination including the abdomen and red reflex, a blood count with film, urine, and a TB contact history.", 1],
  ["Reassure: viral fevers can last weeks.", 0],
  ["Refer to psychiatry for parental anxiety.", 0]],
 "<h6>Why</h6><p>Repeated presentation, failing antibiotics and a parent reporting a change in behaviour are <b>red flags</b>. Stop prescribing and investigate: TB, UTI, leukaemia, deep abscess and inflammatory disease all hide this way.</p><div class='why-wrong'>A fourth antibiotic continues the pattern that is failing. Prolonged fever with a behavioural change is not reassuring. Parental concern is a clinical sign, not a psychiatric one.</div>"),

I("X26", 11,
 "A 14-month-old with 2 days of watery diarrhoea is irritable, has sunken eyes and drinks eagerly; skin pinch goes back slowly. There is no malnutrition. What is the correct plan?",
 [["Plan B: ORS 75 mL/kg over 4 hours at the facility, zinc, and continued feeding.", 1],
  ["Plan C: IV Ringer's lactate.", 0],
  ["Plan A: home fluids only.", 0],
  ["IV 5% dextrose at maintenance.", 0]],
 "<h6>Why</h6><p>Restless, sunken eyes, eager drinking and a slow skin pinch is <b>some dehydration</b>: <b>Plan B</b>, with zinc for 10&ndash;14 days and continued feeding.</p><div class='why-wrong'>Plan C is for severe dehydration. Plan A is for no dehydration. 5% dextrose is not a rehydration fluid.</div>"),

I("X27", 14,
 "A 6-year-old stung by a scorpion is given prazosin. An hour later she is cold, sweating and hypotensive, with crackles at both bases. What is the most appropriate addition?",
 [["Atropine to reduce secretions.", 0],
  ["Dobutamine for low cardiac output, oxygen with CPAP or ventilation, and scorpion antivenom if available.", 1],
  ["A 40 mL/kg fluid bolus.", 0],
  ["Nifedipine.", 0]],
 "<h6>Why</h6><p>She has moved into the <b>low-output phase with pulmonary oedema</b>. Support the heart with <b>dobutamine</b>, the lungs with CPAP or ventilation, and give scorpion antivenom where available.</p><div class='why-wrong'>Atropine worsens tachycardia. A large bolus worsens pulmonary oedema. Nifedipine causes reflex tachycardia.</div>"),

I("X28", 19,
 "A 9-year-old with a VP shunt has had headache and vomiting since yesterday and is now drowsy. Her parents say she has had &ldquo;tummy bugs&rdquo; like this before. What should you do?",
 [["Treat as gastroenteritis and discharge with ORS.", 0],
  ["Treat as possible shunt malfunction: urgent imaging, neurosurgical review and raised-pressure precautions.", 1],
  ["Give an antiemetic and review tomorrow.", 0],
  ["Perform a lumbar puncture to check for infection.", 0]],
 "<h6>Why</h6><p>Headache, vomiting and drowsiness in a child with a shunt is <b>shunt malfunction</b> until proven otherwise &mdash; a raised-pressure emergency. Do not let the previous episodes overshadow this one.</p><div class='why-wrong'>Discharging or delaying review risks herniation. LP is contraindicated with suspected raised pressure.</div>"),

I("X29", 17,
 "A 3-week-old has deep cyanosis and poor perfusion. Femoral pulses are hard to feel, the liver is enlarged, and SpO₂ is 70% in both hand and foot. The nearest cardiology centre is 5 hours away. What should be considered before transfer?",
 [["Prostaglandin E1 infusion after discussion with the cardiology centre, with readiness to manage apnoea.", 1],
  ["High-dose oxygen alone, because cyanosis always responds to oxygen.", 0],
  ["A 40 mL/kg fluid bolus.", 0],
  ["Wait for an echocardiogram before any treatment.", 0]],
 "<h6>Why</h6><p>Shock or cyanosis in the first weeks with weak femorals suggests a <b>duct-dependent lesion</b>. Prostaglandin E1 can reopen the duct; discuss with cardiology and be ready for apnoea.</p><div class='why-wrong'>Oxygen alone does not open the duct. A large bolus worsens a failing heart. Waiting 5 hours for echo lets the duct close further.</div>"),

I("X30", 20,
 "After a child dies despite resuscitation, the team is shaken. The mother asks, &ldquo;Did he die because we came late?&rdquo; What is the best first response?",
 [["&ldquo;Yes, if you had come earlier he would have lived.&rdquo;", 0],
  ["Sit down with her, use her son's name, give an honest account in plain words, acknowledge her question without blame, and arrange a later meeting.", 1],
  ["&ldquo;We did everything possible&rdquo;, then leave quickly.", 0],
  ["Refer the question to the hospital's legal department.", 0]],
 "<h6>Why</h6><p>Families remember these conversations for life. Use <b>SPIKES</b>: sit, use the child's name, speak honestly and simply, allow silence, and do not assign blame. Offer a follow-up meeting.</p><div class='why-wrong'>Blaming the mother is unkind and usually inaccurate. A rushed exit leaves her alone. Referring to lawyers is not a response to grief.</div>")

];
})();
</script>
